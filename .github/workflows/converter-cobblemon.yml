name: Converter Cobblemon (Fase 1)

# Rodar manualmente: aba Actions > "Converter Cobblemon (Fase 1)" > Run workflow
# e colar o link DIRETO do jar Cobblemon-fabric 1.8.4 (Minecraft 1.21.1).
# O resultado fica como ARTEFATO (privado ao repositorio). NAO publica Release.
on:
  workflow_dispatch:
    inputs:
      jar_url:
        description: "Link do jar OU a pagina da versao 1.8.4 no Modrinth (https)"
        required: true

jobs:
  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar o jar
        env:
          JAR_URL: ${{ inputs.jar_url }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, zipfile
          url = os.environ["JAR_URL"].strip()
          UA = {"User-Agent": "cobblemon-port-workflow (github actions)"}
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=120)
          if "modrinth.com/" in url and "cdn.modrinth.com" not in url:
              # pagina do Modrinth -> acha o jar Fabric 1.8.4 / 1.21.1 pela API
              q = urllib.parse.urlencode({"loaders": json.dumps(["fabric"]),
                                          "game_versions": json.dumps(["1.21.1"])})
              versions = json.load(get(f"https://api.modrinth.com/v2/project/cobblemon/version?{q}"))
              cand = [v for v in versions if v["version_number"].startswith("1.8.4")]
              if not cand:
                  raise SystemExit("Nao achei 1.8.4 Fabric 1.21.1. Versoes: " +
                                   ", ".join(v["version_number"] for v in versions[:10]))
              files = cand[0]["files"]
              f = next((x for x in files if x.get("primary")), files[0])
              url = f["url"]
              print("Jar encontrado:", cand[0]["version_number"], url)
          with get(url) as r, open("cobblemon.jar", "wb") as o:
              o.write(r.read())
          z = zipfile.ZipFile("cobblemon.jar")   # falha aqui se baixou HTML
          print(os.path.getsize("cobblemon.jar") // 1000000, "MB;", len(z.namelist()), "arquivos no jar")
          PY

      - name: Converter
        run: python3 tools/cobblemon_to_hmod.py --jar cobblemon.jar --out dist

      # Mesmo passo do workflow do mod de teste que funcionou (build-teste.yml).
      # Se o seu usa outro jeito de instalar, copie o passo de la.
      - name: Instalar cargo-horizon-mod
        continue-on-error: true
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --git https://github.com/horizon-rust/horizon cargo-horizon-mod

      - name: Check de cada pacote (nao para no primeiro erro)
        continue-on-error: true
        run: |
          for p in assets vanilla full; do
            echo "=============== check cobblemon_$p.hmod ===============" | tee -a dist/check.log
            cargo horizon-mod check dist/cobblemon_$p.hmod 2>&1 | tail -n 60 | tee -a dist/check.log || true
          done

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: cobblemon-hmod
          path: dist/
          retention-days: 14
